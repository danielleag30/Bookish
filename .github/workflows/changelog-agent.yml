name: Changelog agent

# Drafts CHANGELOG.md from merged pull requests and opens a pull request with it.
#
# It never writes to main. The agent's job ends at "here is a draft"; a human
# decides whether it ships. That boundary is the point of the workflow, not an
# afterthought — see AUTONOMY.md.

on:
  workflow_dispatch:
    inputs:
      use_model:
        description: 'Summarise entries with GitHub Models (off = PR titles verbatim)'
        type: boolean
        default: true
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write        # to push the agent's branch
  pull-requests: write   # to open the PR
  models: read           # GitHub Models, for the one-line summaries

jobs:
  draft:
    # Only on a real merge, and never on the agent's own pull requests, which
    # would loop.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       !startsWith(github.event.pull_request.head.ref, 'agent/'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Draft the changelog
        id: draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FLAGS=""
          if [ "${{ inputs.use_model }}" = "false" ]; then FLAGS="--no-model"; fi
          # The script prints "changed" or "unchanged" on stdout; its progress
          # goes to stderr so this stays parseable.
          RESULT=$(npm run --silent changelog -- $FLAGS)
          echo "result=$RESULT" >> "$GITHUB_OUTPUT"

      - name: Upload the draft as an artifact
        # Inspectable even when nothing changed, so a run can be reviewed
        # without reading the logs.
        uses: actions/upload-artifact@v4
        with:
          name: changelog-draft
          path: CHANGELOG.md
          if-no-files-found: warn

      - name: Open a pull request
        if: steps.draft.outputs.result == 'changed'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          BRANCH="agent/changelog-$(date +%Y%m%d-%H%M%S)"
          git config user.name  "bookish-changelog-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add CHANGELOG.md
          git commit -m "Draft changelog from merged pull requests"
          git push origin "$BRANCH"

          BODY=$(cat <<'EOF'
          Drafted by the changelog agent from merged pull requests.

          **Please read it rather than rubber-stamping it.** The grouping is
          deterministic, but the one-line summaries are model-written and may
          describe a change more confidently than it deserves.

          Re-run with `use_model: false` to regenerate using PR titles verbatim.
          EOF
          )

          # Opening the PR can be blocked by a repository setting
          # (Settings -> Actions -> General -> "Allow GitHub Actions to create and
          # approve pull requests"). That is a legitimate way to run this: the
          # agent's work is already pushed, so the job reports the branch and a
          # one-click link instead of failing. The draft still exists either way.
          if gh pr create --title "Changelog draft" --body "$BODY" \
               --head "$BRANCH" --base main 2>/tmp/pr-err; then
            echo "Opened a pull request from \`$BRANCH\`." >> "$GITHUB_STEP_SUMMARY"
          else
            REPO="${{ github.repository }}"
            {
              echo "### Draft pushed, pull request not opened"
              echo
              echo "The branch \`$BRANCH\` is ready. GitHub Actions could not open the"
              echo "pull request itself:"
              echo
              echo '```'
              cat /tmp/pr-err
              echo '```'
              echo
              echo "**[Open it here](https://github.com/$REPO/compare/main...$BRANCH?expand=1)**"
              echo
              echo "To let the agent do this itself, enable *Settings → Actions → General →"
              echo "Workflow permissions → Allow GitHub Actions to create and approve pull"
              echo "requests*. Leaving it off is a defensible choice — it just means a human"
              echo "opens the pull request as well as merging it."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
