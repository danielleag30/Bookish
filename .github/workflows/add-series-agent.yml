name: Add-series agent

# Turns an issue into a pull request adding a new series chart.
#
#   1. open an issue with the `add-series` label, notes in the body
#   2. the agent extracts a character graph from those notes
#   3. it validates the result against the schema
#   4. it opens a pull request — never commits to main
#   5. a human reviews and merges, or does not
#
# The `agent-writes` environment gates step 4. Configure it with a required
# reviewer in Settings → Environments, and the job waits for approval before it
# is allowed to push anything.

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      series_id:
        description: 'Slug for the new series, e.g. iron-widow'
        required: true
      notes:
        description: 'Source notes — plot beats, one per line. Not book text.'
        required: true

permissions:
  contents: read

jobs:
  extract:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'add-series'
    runs-on: ubuntu-latest
    permissions:
      # No model is called in this job — it writes the notes to a file and
      # validates the existing data. Declaring `models: read` here would grant a
      # capability nothing uses.
      contents: read
    outputs:
      series: ${{ steps.plan.outputs.series }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Plan
        id: plan
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          INPUT_NOTES: ${{ inputs.notes }}
          INPUT_ID: ${{ inputs.series_id }}
        run: |
          NOTES="${INPUT_NOTES:-$ISSUE_BODY}"

          # Prefer an explicit "**Slug:** foo" line in the notes. Deriving from
          # the title turned "Fae & Alchemy" into "fae-&-alchemy", which is not a
          # usable filename or branch name.
          SERIES="$INPUT_ID"
          if [ -z "$SERIES" ]; then
            SERIES=$(printf '%s' "$NOTES" | grep -iom1 '\*\*Slug:\*\*[[:space:]]*[A-Za-z0-9_-]*' | sed 's/.*\*\*[[:space:]]*//')
          fi
          if [ -z "$SERIES" ]; then
            SERIES=$(echo "${{ github.event.issue.title }}" | sed 's/.*: *//')
          fi
          # Whatever the source, force it into a safe slug.
          SERIES=$(printf '%s' "$SERIES" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E -e 's/&/and/g' -e 's/[^a-z0-9]+/-/g' -e 's/^-+//' -e 's/-+$//')
          if [ -z "$SERIES" ]; then
            echo "::error::could not derive a series slug from the issue" && exit 1
          fi

          echo "series=$SERIES" >> "$GITHUB_OUTPUT"
          mkdir -p pipeline/input
          printf '%s' "$NOTES" > "pipeline/input/$SERIES.md"
          echo "### Plan" >> "$GITHUB_STEP_SUMMARY"
          echo "Series: \`$SERIES\`" >> "$GITHUB_STEP_SUMMARY"
          wc -l < "pipeline/input/$SERIES.md" | xargs -I{} echo "Source lines: {}" >> "$GITHUB_STEP_SUMMARY"

      - name: Validate the existing data still passes
        # The agent must not be the reason the repo breaks. If the baseline is
        # already failing, stop before doing anything else.
        run: npm run validate

      - name: Upload the plan and inputs
        uses: actions/upload-artifact@v4
        with:
          name: add-series-plan
          path: pipeline/input/

  propose:
    needs: extract
    runs-on: ubuntu-latest
    # Human-in-the-loop. Nothing is pushed until a reviewer approves this
    # environment, so the agent can propose but never merge.
    environment: agent-writes
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: add-series-plan, path: pipeline/input }

      - name: Open a pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERIES: ${{ needs.extract.outputs.series }}
        run: |
          BRANCH="agent/add-series-$SERIES"
          git config user.name  "bookish-series-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add pipeline/input
          git commit -m "Add source notes for $SERIES

          Opened by .github/workflows/add-series-agent.yml. The extracted graph
          still needs review against the schema and the relationship vocabulary
          before it becomes a chart."
          git push origin "$BRANCH"

          BODY=$(cat <<'EOF'
          Opened by the add-series agent from an issue.

          **Not ready to merge as-is.** Check against RELATIONSHIPS.md and
          DATA-DICTIONARY.md: relationship types must be canonical, book numbers
          start at 1, and `npm run validate` must pass.
          EOF
          )

          # Same fallback as the changelog agent: opening the pull request can be
          # blocked by a repository setting, and that is a legitimate way to run
          # this. The branch is already pushed either way.
          if gh pr create --title "Add series: $SERIES" --body "$BODY" \
               --head "$BRANCH" --base main 2>/tmp/pr-err; then
            echo "Opened a pull request from \`$BRANCH\`." >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Branch pushed, pull request not opened"
              echo
              echo '```'
              cat /tmp/pr-err
              echo '```'
              echo
              echo "**[Open it here](https://github.com/${{ github.repository }}/compare/main...$BRANCH?expand=1)**"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
