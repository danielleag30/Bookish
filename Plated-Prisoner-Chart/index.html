<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>The Plated Prisoner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#100a12;color:#e8e6f0;font-family:'DM Sans',system-ui,sans-serif;
      min-height:100vh;display:flex;flex-direction:column;padding:14px 16px 16px}
    header{text-align:center;padding:4px 0 12px;flex:0 0 auto}
    header h1{font-family:'Cinzel',serif;font-size:clamp(1.5rem,4vw,2.4rem);letter-spacing:.04em;
      color:#e0a63c}
    header p{font-size:.76rem;color:#a49bba;margin-top:4px}
    header a{color:#a49bba}
    /* The engine reads these, so each series keeps its own identity. */
    #chart{flex:1 1 auto;--bkc-accent:#e0a63c;--bkc-panel:rgba(28,16,30,.92);--bkc-line:rgba(224,166,60,.26)}
  </style>
</head>
<body>
  <header>
    <h1>The Plated Prisoner</h1>
    <p>Alliances and betrayals across Raven Kennedy's gilded-court series · <a href="/">all series</a></p>
  </header>

  <!-- The whole chart. One engine, three series: see src/engine/ -->
  <div id="chart"></div>

  <script type="module">
    import { boot } from '/chart/chart.js';
    boot({ series: 'plated-prisoner' });
  </script>
</body>
</html>
