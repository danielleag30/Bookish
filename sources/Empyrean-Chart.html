<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Fourth Wing — The Empyrean Chart</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:'DM Sans',sans-serif;
  background:#05060e;
  color:#cfd8e6;
  height:100vh;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  background-image:
    radial-gradient(ellipse at 15% 0%,rgba(80,40,180,.18) 0%,transparent 55%),
    radial-gradient(ellipse at 85% 100%,rgba(30,80,160,.16) 0%,transparent 55%),
    radial-gradient(ellipse at 50% 50%,rgba(167,139,250,.05) 0%,transparent 70%);
}

/* Subtle storm-cloud particles */
.stars{position:fixed;top:0;left:0;width:100vw;height:100vh;pointer-events:none;z-index:0;overflow:hidden}
.star{position:absolute;background:#a78bfa;border-radius:50%;animation:twinkle 4s infinite ease-in-out;box-shadow:0 0 4px #a78bfa66}
@keyframes twinkle{0%,100%{opacity:.15}50%{opacity:.6}}

/* Lightning flicker on header */
@keyframes flash{
  0%,100%{text-shadow:0 0 22px rgba(167,139,250,.45),2px 2px 0 #0a0a18}
  47%{text-shadow:0 0 22px rgba(167,139,250,.45),2px 2px 0 #0a0a18}
  48%{text-shadow:0 0 60px rgba(220,220,255,.95),0 0 35px #fff,2px 2px 0 #0a0a18}
  49%{text-shadow:0 0 22px rgba(167,139,250,.45),2px 2px 0 #0a0a18}
  52%{text-shadow:0 0 60px rgba(220,220,255,.85),0 0 30px #fff,2px 2px 0 #0a0a18}
  53%{text-shadow:0 0 22px rgba(167,139,250,.45),2px 2px 0 #0a0a18}
}

/* ── Header ─────────────────────────────────────────── */
#header{
  text-align:center;
  padding:9px 12px 6px;
  background:linear-gradient(180deg,#0c0a1f 0%,#06070f 100%);
  border-bottom:2px solid #2a1f4a;
  position:relative;
  flex-shrink:0;
  z-index:2;
}
#header::before{
  content:'⚡  FLY OR DIE  ⚡';
  display:block;
  font-size:.55rem;
  color:#a78bfa;
  letter-spacing:3px;
  margin-bottom:5px;
  font-family:'Cinzel',serif;
  font-weight:600;
}
#header h1{
  font-family:'Cinzel',serif;
  font-size:2.1rem;
  font-weight:700;
  color:#e0e7ff;
  letter-spacing:6px;
  line-height:1;
  animation:flash 9s infinite;
  background:linear-gradient(180deg,#ffffff 0%,#e0e7ff 50%,#c4b5fd 100%);
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
}
#header p{
  font-size:.62rem;
  color:#7d6fa8;
  margin-top:4px;
  font-family:'Cormorant Garamond',serif;
  font-style:italic;
  letter-spacing:1px;
}

/* ── Controls ───────────────────────────────────────── */
#controls{
  padding:6px 10px;
  background:#0a0817;
  border-bottom:1px solid #1f1838;
  flex-shrink:0;
  position:relative;
  z-index:2;
}
.book-row{display:flex;gap:4px;justify-content:center;margin-bottom:3px;flex-wrap:wrap}
.book-row:last-child{margin-bottom:0}

.btn{
  padding:4px 10px;
  border-radius:5px;
  border:1px solid #2a1f4a;
  background:#0e0b1f;
  color:#8a7eaa;
  font-size:.65rem;
  cursor:pointer;
  white-space:nowrap;
  transition:all .15s;
  flex:1;
  max-width:175px;
  text-align:center;
  font-family:'DM Sans',sans-serif;
  font-weight:500;
}
.btn:hover{border-color:#a78bfa;color:#e0e7ff;box-shadow:0 0 8px rgba(167,139,250,.25)}
.btn.book-on{
  background:linear-gradient(135deg,#3b1d6e,#7c3aed);
  border-color:#a78bfa;
  color:#fff;
  font-weight:700;
  box-shadow:0 0 12px rgba(167,139,250,.5);
}
.btn.book-future{opacity:.55;font-style:italic}
.btn.tog{flex:0 0 auto;max-width:170px}
.btn.tog-on{border-color:#fbbf24;color:#fbbf24;background:#1a1305;box-shadow:0 0 8px rgba(251,191,36,.2)}

/* ── Rel bar ────────────────────────────────────────── */
#relbar{
  display:flex;gap:4px;flex-wrap:wrap;justify-content:center;
  padding:4px 10px;
  background:#06050f;
  border-bottom:1px solid #14102a;
  flex-shrink:0;
  position:relative;
  z-index:2;
}
.rbtn{
  padding:2px 9px;border-radius:4px;
  border:1px solid #1f1838;background:#0a0817;
  font-size:.62rem;cursor:pointer;color:#7d6fa8;
  transition:all .15s;font-family:'DM Sans',sans-serif;
}
.rbtn:hover{border-color:#a78bfa;color:#e0e7ff}
.rbtn.active{font-weight:700}

/* ── Layout ─────────────────────────────────────────── */
#layout{display:flex;flex:1;overflow:hidden;min-height:0;position:relative;z-index:1}
#canvas{flex:1;position:relative;overflow:auto;background:#04050c;cursor:grab}
#canvas:active{cursor:grabbing}
svg{width:100%;height:100%}

/* ── Sidebar ────────────────────────────────────────── */
#sidebar{
  width:285px;
  background:#0a0817;
  border-left:1px solid #2a1f4a;
  overflow-y:auto;
  flex-shrink:0;
  display:flex;
  flex-direction:column;
  box-shadow:-4px 0 20px rgba(0,0,0,.5);
}
#sidebar-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:9px 11px;
  border-bottom:1px solid #2a1f4a;
  flex-shrink:0;
  background:linear-gradient(180deg,#15102e,#0c0a1f);
}
#sidebar-header span{
  font-size:.66rem;color:#a78bfa;
  text-transform:uppercase;letter-spacing:1.5px;
  font-family:'Cinzel',serif;font-weight:600;
}
#sidebar-close{
  background:none;border:1px solid #2a1f4a;
  color:#7d6fa8;border-radius:4px;
  padding:1px 7px;font-size:.65rem;cursor:pointer;
}
#sidebar-close:hover{border-color:#a78bfa;color:#e0e7ff}
#sidebar-body{flex:1;overflow-y:auto}

/* Scrollbar */
#sidebar-body::-webkit-scrollbar{width:6px}
#sidebar-body::-webkit-scrollbar-track{background:#06050f}
#sidebar-body::-webkit-scrollbar-thumb{background:#2a1f4a;border-radius:3px}

/* Sidebar content */
.panel{padding:11px;border-bottom:1px solid #14102a}
.panel h3{
  font-size:.66rem;color:#a78bfa;
  text-transform:uppercase;letter-spacing:1.2px;
  margin-bottom:6px;font-family:'Cinzel',serif;font-weight:600;
}
.panel p{color:#9c8fbf;line-height:1.55;font-size:.7rem}
.evt{padding:4px 8px;margin:3px 0;border-left:2px solid #a78bfa;background:#15102e;color:#cfd8e6;font-size:.66rem;border-radius:0 3px 3px 0}

/* Character card */
#char-portrait{
  width:100%;
  aspect-ratio:1;
  background:linear-gradient(135deg,#15102e,#06050f);
  display:flex;align-items:center;justify-content:center;
  border-bottom:1px solid #2a1f4a;
  position:relative;
  overflow:hidden;
}
#char-portrait::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(circle at 50% 35%,rgba(167,139,250,.2),transparent 60%);
}
#char-portrait::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,transparent 55%,#0a0817 100%);
}
#char-portrait .ptype-shape{position:relative;z-index:1}
#char-portrait .faction-bar{
  position:absolute;bottom:0;left:0;right:0;
  padding:7px 11px;
  font-size:.62rem;font-weight:600;letter-spacing:1px;text-transform:uppercase;
  font-family:'Cinzel',serif;
  z-index:2;
}
#card-body{padding:13px}
#card-body h2{
  font-family:'Cinzel',serif;
  font-size:1.25rem;letter-spacing:1px;
  margin-bottom:3px;line-height:1.1;
  font-weight:700;
}
.tag{display:inline-block;padding:2px 8px;border-radius:3px;font-size:.6rem;margin:2px 2px 2px 0;color:#fff;font-weight:500}
.stat-row{display:flex;gap:6px;margin:9px 0;flex-wrap:wrap}
.stat{
  background:#0c0a1f;border:1px solid #2a1f4a;
  border-radius:4px;padding:4px 8px;
  font-size:.62rem;color:#9c8fbf;flex:1;min-width:75px;
}
.stat b{color:#a78bfa;display:block;font-size:.55rem;text-transform:uppercase;letter-spacing:.6px;font-weight:600;margin-bottom:1px}
.bio-text{font-size:.7rem;color:#9c8fbf;line-height:1.6;margin-top:7px;font-family:'Cormorant Garamond',serif;font-size:.78rem}
.ch4{font-size:.63rem;color:#a78bfa;text-transform:uppercase;margin:11px 0 5px;font-weight:600;font-family:'Cinzel',serif;letter-spacing:1px}
.ci{font-size:.63rem;color:#9c8fbf;padding:3px 0;border-bottom:1px solid #14102a}
.ci .cn{color:#e0e7ff;font-weight:500}

/* ── Legend overlay ─────────────────────────────────── */
#leg-ov{
  position:absolute;bottom:10px;left:10px;
  background:#0a0817ee;border:1px solid #2a1f4a;
  border-radius:7px;font-size:.62rem;color:#9c8fbf;
  z-index:11;min-width:215px;user-select:none;
  box-shadow:0 4px 24px rgba(0,0,0,.6);
  backdrop-filter:blur(6px);
}
#leg-hdr{
  display:flex;align-items:center;justify-content:space-between;
  padding:7px 11px;border-bottom:1px solid #2a1f4a;
  cursor:move;border-radius:7px 7px 0 0;background:#15102e;
}
#leg-hdr span{color:#a78bfa;font-weight:600;font-size:.65rem;letter-spacing:1.2px;font-family:'Cinzel',serif}
#leg-body{padding:9px 11px;max-height:60vh;overflow-y:auto}
#leg-body::-webkit-scrollbar{width:5px}
#leg-body::-webkit-scrollbar-thumb{background:#2a1f4a;border-radius:3px}

/* Sidebar reopen button */
#sidebar-reopen{
  position:absolute;top:8px;right:8px;z-index:22;
  background:#15102e;border:1px solid #2a1f4a;
  color:#a78bfa;border-radius:4px;
  padding:5px 11px;font-size:.62rem;cursor:pointer;
  font-family:'DM Sans',sans-serif;
  display:none;
}
#sidebar-reopen:hover{border-color:#a78bfa;color:#e0e7ff}

/* Legend reopen button */
#legend-reopen{
  position:absolute;bottom:10px;left:10px;z-index:22;
  background:#15102e;border:1px solid #2a1f4a;
  color:#a78bfa;border-radius:4px;
  padding:5px 11px;font-size:.62rem;cursor:pointer;
  font-family:'DM Sans',sans-serif;
  display:none;
  box-shadow:0 2px 12px rgba(0,0,0,.5);
}
#legend-reopen:hover{border-color:#a78bfa;color:#e0e7ff}

/* ── Search overlay (mirrors legend, top-left) ──── */
#search-ov{
  position:absolute;top:10px;left:10px;
  background:#0a0817ee;border:1px solid #2a1f4a;
  border-radius:7px;font-size:.62rem;color:#9c8fbf;
  z-index:11;width:235px;user-select:none;
  box-shadow:0 4px 24px rgba(0,0,0,.6);
  backdrop-filter:blur(6px);
}
#search-hdr{
  display:flex;align-items:center;justify-content:space-between;
  padding:7px 11px;border-bottom:1px solid #2a1f4a;
  border-radius:7px 7px 0 0;background:#15102e;
}
#search-hdr span{color:#a78bfa;font-weight:600;font-size:.65rem;letter-spacing:1.2px;font-family:'Cinzel',serif}
#search-body{padding:9px 11px}
#search-input{
  width:100%;padding:6px 9px;
  background:#06050f;border:1px solid #2a1f4a;
  border-radius:4px;color:#e0e7ff;
  font-size:.72rem;font-family:'DM Sans',sans-serif;
  outline:none;transition:border-color .15s;
}
#search-input:focus{border-color:#a78bfa;box-shadow:0 0 8px rgba(167,139,250,.25)}
#search-input::placeholder{color:#5a4a7a;font-style:italic}
#search-results{
  margin-top:6px;max-height:260px;overflow-y:auto;
  border-top:1px solid #2a1f4a;padding-top:5px;
  display:none;
}
#search-results.open{display:block}
#search-results::-webkit-scrollbar{width:5px}
#search-results::-webkit-scrollbar-thumb{background:#2a1f4a;border-radius:3px}
.sr-item{
  padding:5px 8px;border-radius:4px;cursor:pointer;
  display:flex;align-items:center;gap:7px;
  margin-bottom:2px;transition:background .12s;
}
.sr-item:hover{background:#15102e}
.sr-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;border:1.2px solid}
.sr-name{color:#e0e7ff;font-size:.7rem;font-weight:500}
.sr-role{color:#7d6fa8;font-size:.6rem;margin-top:1px;font-style:italic}
.sr-empty{padding:8px;color:#5a4a7a;font-style:italic;text-align:center;font-size:.65rem}

/* ── Signet glyph badge on nodes ─────────────────── */
.signet-glyph{
  pointer-events:none;
  font-weight:bold;
}

/* ── Legend collapsible sections ─────────────────── */
.leg-section-hdr{
  color:#a78bfa;font-size:9px;text-transform:uppercase;
  margin:6px 0 2px;font-family:Cinzel,serif;font-weight:600;
  letter-spacing:0.5px;cursor:pointer;
  display:flex;justify-content:space-between;align-items:center;
  padding:2px 0;user-select:none;
}
.leg-section-hdr:hover{color:#c4b5fd}
.leg-section-hdr .lcaret{font-size:8px;color:#7d6fa8}
.leg-section-body{display:block}
.leg-section-body.collapsed{display:none}

/* ── Violet pulse ring at load ────────────────── */
@keyframes violet-pulse{
  0%{r:34;opacity:0.9}
  100%{r:60;opacity:0}
}
.v-pulse{
  fill:none;stroke:#a78bfa;stroke-width:2;
  animation:violet-pulse 1.8s ease-out infinite;
}

/* Signature trait styling on card */
.sig-trait{
  background:linear-gradient(135deg,rgba(167,139,250,.08),rgba(124,58,237,.05));
  border-left:2px solid #a78bfa;
  padding:7px 10px;margin:9px 0 5px;
  font-family:'Cormorant Garamond',serif;
  font-style:italic;font-size:.8rem;
  color:#c4b5fd;line-height:1.45;
  border-radius:0 4px 4px 0;
}
.sig-trait::before{
  content:'❝ ';color:#7c3aed;font-style:normal;font-weight:bold;
}

/* Mobile-ish */
@media(max-width:780px){
  #sidebar{
    width:100%;max-width:340px;
    position:absolute;top:0;right:0;height:100%;
    z-index:30;
    transform:translateX(100%);
    transition:transform .25s ease-out;
    box-shadow:-8px 0 30px rgba(0,0,0,.7);
  }
  #sidebar.mobile-open{transform:translateX(0)}
  #header h1{font-size:1.4rem;letter-spacing:3px}
  .btn{font-size:.6rem;padding:3px 7px}
  #search-ov{width:200px;top:8px;left:8px}
  #leg-ov{min-width:175px;bottom:8px;left:8px;font-size:.58rem}
  #sidebar-reopen{display:block !important}
}
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<div id="header">
  <h1>THE EMPYREAN SERIES</h1>
  <p>Character Relationship Chart · The Empyrean by Rebecca Yarros · click a node to learn their story</p>
</div>

<div id="controls">
  <div class="book-row" id="row1"></div>
  <div class="book-row" id="row2"></div>
</div>
<div id="relbar"></div>

<div id="layout">
  <div id="canvas"><svg id="svg"></svg></div>
  <div id="sidebar">
    <div id="sidebar-header">
      <span id="sidebar-title">Book Overview</span>
      <button id="sidebar-close">✕</button>
    </div>
    <div id="sidebar-body"></div>
  </div>
</div>

<script>
// ╔══════════════════════════════════════════════════════════════════╗
// ║ DATA                                                             ║
// ╚══════════════════════════════════════════════════════════════════╝

const BOOKS = [
  {id:1, title:"Fourth Wing",          short:"Fourth Wing",   year:2023, era:"First-year cadet"},
  {id:2, title:"Iron Flame",           short:"Iron Flame",    year:2023, era:"Second-year · Revolution begins"},
  {id:3, title:"Onyx Storm",           short:"Onyx Storm",    year:2025, era:"Quest for the Irids"},
  {id:4, title:"Untitled (Book 4)",    short:"Book 4 (TBA)",  year:2027, era:"Coming · post-Onyx Storm cliffhanger", future:true},
];

// Bands = social/factional regions of the world. Top to bottom: divine → leadership → riders → support → revolution → poromiel → corrupted
const BH = 105;
const BANDS = [
  {id:"gods",       label:"Gods & Mythic",                                  y:0,        h:90},
  {id:"leadership", label:"Navarre Leadership · House Tauri · Faculty",    y:90,       h:190},
  {id:"riders",     label:"Riders Quadrant — Basgiath War College",        y:280,      h:480},
  {id:"support",    label:"Scribes · Healers · Allies",                     y:760,      h:90},
  {id:"aretia",     label:"Marked Ones · Revolution · Aretia",              y:850,      h:170},
  {id:"poromiel",   label:"Poromiel · Gryphon Fliers",                      y:1020,     h:105},
  {id:"venin",      label:"The Barrens · Venin · Wyvern",                   y:1125,     h:155},
];

// Affiliations (groups within a band — used for badges + colors)
const AFFIL = {
  riders_4w:    {label:"Fourth Wing · Riders",       color:"#a78bfa", border:"#7c3aed"},
  riders_other: {label:"Riders (other Wings)",       color:"#8a7eaa", border:"#5a4a7a"},
  scribes:      {label:"Scribes Quadrant",           color:"#fbbf24", border:"#b8860b"},
  healers:      {label:"Healers Quadrant",           color:"#34d399", border:"#0e7c5a"},
  faculty:      {label:"Faculty / Leadership",       color:"#60a5fa", border:"#1e40af"},
  royal:        {label:"House Tauri (Royal)",        color:"#f472b6", border:"#9d174d"},
  marked:       {label:"Marked Ones / Aretia",       color:"#ef4444", border:"#7f1d1d"},
  poromiel:     {label:"Poromiel / Fliers",          color:"#f59e0b", border:"#92400e"},
  venin:        {label:"Venin / Dark wielders",      color:"#dc2626", border:"#450a0a"},
  god:          {label:"Gods / Mythic",              color:"#fde68a", border:"#a16207"},
  irid:         {label:"Irid (hidden archipelago)",  color:"#22d3ee", border:"#0e7490"},
  rebellion:    {label:"Rebellion (pre-series)",     color:"#a16207", border:"#451a03"},
};

// Dragon den palette (canon-accurate)
const DRAGON_DEN = {
  black:  {label:"Black",  fill:"#1a1a1a", stroke:"#666", glow:"#333"},
  blue:   {label:"Blue",   fill:"#1e3a8a", stroke:"#60a5fa", glow:"#3b82f6"},
  green:  {label:"Green",  fill:"#14532d", stroke:"#22c55e", glow:"#16a34a"},
  brown:  {label:"Brown",  fill:"#451a03", stroke:"#b45309", glow:"#92400e"},
  red:    {label:"Red",    fill:"#7f1d1d", stroke:"#ef4444", glow:"#dc2626"},
  orange: {label:"Orange", fill:"#7c2d12", stroke:"#fb923c", glow:"#ea580c"},
  gold:   {label:"Gold (Irid)", fill:"#78350f", stroke:"#fbbf24", glow:"#fde68a"},
  irid:   {label:"Iridescent", fill:"#0e7490", stroke:"#22d3ee", glow:"#67e8f9"},
};

// Character TYPE — controls SHAPE
// human, dragon, wyvern, gryphon, venin, irid (special dragon), god
const TYPE_SHAPES = {
  human:   {label:"Human",   shape:"circle"},
  dragon:  {label:"Dragon",  shape:"diamond"},
  irid:    {label:"Irid Dragon",  shape:"star8"},
  wyvern:  {label:"Wyvern",  shape:"chevron"},
  gryphon: {label:"Gryphon", shape:"triangle"},
  venin:   {label:"Venin",   shape:"hexagon"},
  god:     {label:"God",     shape:"star6"},
};

// Signet glyphs — small badges that appear next to main characters with distinctive powers
const SIGNET_GLYPHS = {
  violet:   {sym:"⚡", color:"#fde68a"},  // lightning
  xaden:    {sym:"◐", color:"#a78bfa"},  // shadow
  ridoc:    {sym:"❄", color:"#67e8f9"},  // ice
  rhiannon: {sym:"◇", color:"#34d399"},  // summoning
  dain:     {sym:"◉", color:"#fbbf24"},  // retrocognition (read memories)
  imogen:   {sym:"∅", color:"#f472b6"},  // memory erasure
  sloane:   {sym:"⟳", color:"#22d3ee"},  // siphon
  sawyer:   {sym:"⛓", color:"#9ca3af"},  // metal
  brennan:  {sym:"✚", color:"#34d399"},  // mending
  mira:     {sym:"◈", color:"#60a5fa"},  // ward extension
  aaric:    {sym:"◐", color:"#fde68a"},  // precog (different from shadow)
  liam:     {sym:"◎", color:"#fbbf24"},  // farsight
  garrick:  {sym:"➤", color:"#f59e0b"},  // distance wielder
  bodhi:    {sym:"⊘", color:"#34d399"},  // counter
  quinn:    {sym:"◍", color:"#c084fc"},  // astral projection
  cat:      {sym:"♥", color:"#ec4899"},  // emotion-heightening
  lilith:   {sym:"☇", color:"#60a5fa"},  // storm wielder
  theophanie:{sym:"☇", color:"#dc2626"}, // dark storm wielder
  jack:     {sym:"✦", color:"#dc2626"},  // pain inflictor
  lynx:     {sym:"◐", color:"#7c3aed"},  // shadow (next-gen)
  nolon:    {sym:"✚", color:"#22d3ee"},  // mender
  carr:     {sym:"⚔", color:"#9ca3af"},  // executioner
};

// Book transitions — what changed between Book N-1 and Book N
const BOOK_TRANSITIONS = {
  1: null,  // No transition for first book

function mk(tag, attrs){
  const e = document.createElementNS("http://www.w3.org/2000/svg", tag);
  if(attrs) Object.entries(attrs).forEach(([k,v]) => e.setAttribute(k, v));
  return e;
}
function getRC(t){ return (REL_TYPES.find(r => r.id === t) || {color:"#5a4a7a"}).color; }
function getRD(t){ return (REL_TYPES.find(r => r.id === t) || {dash:null}).dash; }
function curvePath(x1,y1,x2,y2){
  const mx = (x1+x2)/2, my = (y1+y2)/2;
  const dx = x2-x1, dy = y2-y1;
  const len = Math.sqrt(dx*dx + dy*dy) || 1;
  const b = Math.min(50, len*.18);
  return `M${x1},${y1} Q${mx - dy/len*b},${my + dx/len*b} ${x2},${y2}`;
}

// Draw a node SHAPE based on type — returns an SVG element
function makeShape(type, cx, cy, r, fill, stroke, strokeW){
  const t = TYPE_SHAPES[type] || TYPE_SHAPES.human;
  const a = {fill, stroke, "stroke-width":strokeW, "stroke-linejoin":"round"};
  switch(t.shape){
    case "circle":
      return mk("circle", {cx, cy, r, ...a});
    case "diamond": {
      const p = [
        [cx, cy-r],
        [cx+r, cy],
        [cx, cy+r],
        [cx-r, cy]
      ].map(p=>p.join(",")).join(" ");
      return mk("polygon", {points:p, ...a});
    }
    case "triangle": {
      const p = [
        [cx, cy-r*1.05],
        [cx+r*0.95, cy+r*0.7],
        [cx-r*0.95, cy+r*0.7]
      ].map(p=>p.join(",")).join(" ");
      return mk("polygon", {points:p, ...a});
    }
    case "chevron": { // wyvern — inverted triangle/diamond hybrid (a bit menacing)
      const p = [
        [cx, cy+r*1.05],
        [cx+r*0.95, cy-r*0.5],
        [cx+r*0.4, cy-r*0.7],
        [cx-r*0.4, cy-r*0.7],
        [cx-r*0.95, cy-r*0.5]
      ].map(p=>p.join(",")).join(" ");
      return mk("polygon", {points:p, ...a});
    }
    case "hexagon": {
      const pts = [];
      for(let i=0;i<6;i++){
        const ang = Math.PI/3*i - Math.PI/2;
        pts.push([cx + r*Math.cos(ang), cy + r*Math.sin(ang)].join(","));
      }
      return mk("polygon", {points:pts.join(" "), ...a});
    }
    case "star6": {
      const pts = [];
      for(let i=0;i<12;i++){
        const ang = Math.PI/6*i - Math.PI/2;
        const rr = i%2===0 ? r : r*0.5;
        pts.push([cx + rr*Math.cos(ang), cy + rr*Math.sin(ang)].join(","));
      }
      return mk("polygon", {points:pts.join(" "), ...a});
    }
    case "star8": {
      const pts = [];
      for(let i=0;i<16;i++){
        const ang = Math.PI/8*i - Math.PI/2;
        const rr = i%2===0 ? r : r*0.55;
        pts.push([cx + rr*Math.cos(ang), cy + rr*Math.sin(ang)].join(","));
      }
      return mk("polygon", {points:pts.join(" "), ...a});
    }
  }
  return mk("circle", {cx, cy, r, ...a});
}

function renderCtrl(){
  row1.innerHTML = "";
  row2.innerHTML = "";
  BOOKS.forEach(b => row1.appendChild(bookBtn(b)));

  // Character type layer toggles
  const typeButtons = [
    {type:"human", label:"👤 Humans"},
    {type:"dragon", label:"🐉 Dragons"},
    {type:"irid", label:"⭐ Irids"},
    {type:"gryphon", label:"🦅 Gryphons"},
    {type:"wyvern", label:"🦎 Wyverns"},
    {type:"venin", label:"😈 Venin"},
    {type:"god", label:"✦ Gods"},
  ];

  // Select All button
  const selectAll = document.createElement("button");
  selectAll.className = "btn tog";
  selectAll.textContent = "✓ Select All";
  selectAll.onclick = () => {
    Object.keys(S.typeFilters).forEach(t => S.typeFilters[t] = true);
    renderCtrl();
    renderSVG();
  };
  row2.appendChild(selectAll);

  // Clear All button
  const clearAll = document.createElement("button");
  clearAll.className = "btn tog";
  clearAll.textContent = "✕ Clear All";
  clearAll.onclick = () => {
    Object.keys(S.typeFilters).forEach(t => S.typeFilters[t] = false);
    renderCtrl();
    renderSVG();
  };
  row2.appendChild(clearAll);

  // Individual type filter buttons
  typeButtons.forEach(({type, label}) => {
    const btn = document.createElement("button");
    btn.className = "btn tog" + (S.typeFilters[type] ? " tog-on" : "");
    btn.textContent = label;
    btn.onclick = () => {
      S.typeFilters[type] = !S.typeFilters[type];
      btn.className = "btn tog" + (S.typeFilters[type] ? " tog-on" : "");
      renderSVG();
    };
    row2.appendChild(btn);
  });
}

function bookBtn(b){
  const btn = document.createElement("button");
  btn.className = "btn" + (S.book >= b.id ? " book-on" : "") + (b.future ? " book-future" : "");
  btn.title = b.title + " · " + b.era + " (" + b.year + ")";
  btn.textContent = "Book " + b.id + " · " + b.short;
  btn.onclick = () => {
    S.book = b.id;
    S.selNode = null;
    S.showVioletPulse = false;  // Stop pulse once user starts navigating
    render();
  };
  return btn;
}

function renderRelBar(){
  relbar.innerHTML = "";
  REL_TYPES.forEach(r => {
    const b = document.createElement("button");
    b.className = "rbtn" + (S.rel === r.id ? " active" : "");
    if(S.rel === r.id) b.style.cssText = "border-color:" + r.color + ";color:" + r.color;
    b.textContent = r.label;
    b.onclick = () => { S.rel = r.id; renderRelBar(); renderSVG(); };
    relbar.appendChild(b);
  });
  
  // Clear All button at the end
  const clearBtn = document.createElement("button");
  clearBtn.className = "rbtn" + (S.rel === null ? " active" : "");
  if(S.rel === null) clearBtn.style.cssText = "border-color:#7d6fa8;color:#7d6fa8";
  clearBtn.textContent = "Clear All";
  clearBtn.onclick = () => { S.rel = null; renderRelBar(); renderSVG(); };
  relbar.appendChild(clearBtn);
}

// ║ SVG RENDER                                                       ║
// ╚══════════════════════════════════════════════════════════════════╝

function renderSVG(){
  while(svgEl.firstChild) svgEl.removeChild(svgEl.lastChild);
  
  // Set static viewBox once - CSS handles actual sizing
  svgEl.setAttribute("viewBox", "0 0 1100 1280");

  // ── defs ──
  const defs = mk("defs");
  // arrow marker
  const arr = mk("marker", {id:"arr", markerWidth:6, markerHeight:6, refX:6, refY:3, orient:"auto"});
  arr.appendChild(mk("path", {d:"M0,0 L0,6 L6,3 z", fill:"#3a2f5a"}));
  defs.appendChild(arr);

  // glow filter for selected nodes
  const filter = mk("filter", {id:"glow", x:"-50%", y:"-50%", width:"200%", height:"200%"});
  const blur = mk("feGaussianBlur", {stdDeviation:"3", result:"coloredBlur"});
  const merge = mk("feMerge");
  merge.appendChild(mk("feMergeNode", {in:"coloredBlur"}));
  merge.appendChild(mk("feMergeNode", {in:"SourceGraphic"}));
  filter.appendChild(blur);
  filter.appendChild(merge);
  defs.appendChild(filter);

  // lightning gradient
  const lg = mk("linearGradient", {id:"lightning", x1:"0%", y1:"0%", x2:"100%", y2:"100%"});
  lg.appendChild(mk("stop", {offset:"0%", "stop-color":"#a78bfa", "stop-opacity":"0.4"}));
  lg.appendChild(mk("stop", {offset:"50%", "stop-color":"#e0e7ff", "stop-opacity":"0.8"}));
  lg.appendChild(mk("stop", {offset:"100%", "stop-color":"#7c3aed", "stop-opacity":"0.4"}));
  defs.appendChild(lg);

  svgEl.appendChild(defs);

  const g = mk("g", {transform:`translate(${S.pan.x},${S.pan.y}) scale(${S.scale})`});
  svgEl.appendChild(g);

  // ── Faction bands ──
  if(S.showBands){
    BANDS.forEach((b,i) => {
      const isAlt = i % 2 === 0;
      if(isAlt){
        g.appendChild(mk("rect", {x:0, y:b.y, width:1100, height:b.h, fill:"rgba(167,139,250,.025)"}));
      }
      // Divider line
      g.appendChild(mk("line", {x1:0, y1:b.y, x2:1100, y2:b.y, stroke:"#1f1838", "stroke-width":.7, opacity:.7}));
      // Band labels (left + right)
      const t = mk("text", {x:8, y:b.y+13, fill:"#9b8fc4", "font-size":8.5, "font-family":"Cinzel, serif", "font-weight":"600", opacity:1, "pointer-events":"none"});
      t.textContent = b.label;
      g.appendChild(t);
      const t2 = mk("text", {x:1113, y:b.y+13, fill:"#9b8fc4", "font-size":8.5, "font-family":"Cinzel, serif", "font-weight":"600", "text-anchor":"end", opacity:1, "pointer-events":"none"});
      t2.textContent = b.label;
      g.appendChild(t2);
    });
    // Final bottom line
    const last = BANDS[BANDS.length-1];
    g.appendChild(mk("line", {x1:0, y1:last.y+last.h, x2:1100, y2:last.y+last.h, stroke:"#1f1838", "stroke-width":.7, opacity:.7}));
  }

  // ── Edges ──
  const visNodes = NODES.filter(n => n.book <= S.book && S.typeFilters[n.type]);
  const visIds = new Set(visNodes.map(n => n.id));
  const visEdges = S.rel === null ? [] : EDGES.filter(e =>
    e.book <= S.book &&
    visIds.has(e.from) && visIds.has(e.to) &&
    (S.rel === "all" || e.type === S.rel)
  );

  // Edges relevant to selected node
  const hlEdges = S.selNode ? visEdges.filter(e => e.from === S.selNode || e.to === S.selNode) : [];
  const hlIds = S.selNode ? new Set([S.selNode, ...hlEdges.flatMap(e => [e.from, e.to])]) : null;

  visEdges.forEach(e => {
    const fp = S.pos[e.from], tp = S.pos[e.to];
    if(!fp || !tp) return;
    const col = getRC(e.type), dash = getRD(e.type);
    const isHl = !S.selNode || (e.from === S.selNode || e.to === S.selNode);
    const dim = S.selNode && !isHl;

    const p = mk("path", {
      d: curvePath(fp.x, fp.y, tp.x, tp.y),
      fill:"none",
      stroke:col,
      "stroke-width": isHl ? (S.rel !== "all" ? 1.8 : 1.4) : 0.4,
      opacity: dim ? 0.06 : (S.rel !== "all" || isHl ? 0.65 : 0.4),
      "marker-end":"url(#arr)",
    });
    if(dash) p.setAttribute("stroke-dasharray", dash);
    g.appendChild(p);

    // Label only when filter active or node selected
    if(isHl && (S.rel !== "all" || S.selNode)){
      const mx = (fp.x+tp.x)/2, my = (fp.y+tp.y)/2;
      const lbl = mk("text", {x:mx, y:my-4, fill:col, "font-size":6.5, "text-anchor":"middle", opacity:.8, "pointer-events":"none"});
      lbl.textContent = e.label;
      g.appendChild(lbl);
    }
  });

  // ── Nodes ──
  visNodes.forEach(n => {
    const pos = S.pos[n.id];
    if(!pos) return;
    const r = n.size === "main" ? 23 : 16;
    const faded = n.lastBook < S.book;
    const isNew = n.book === S.book;
    const sel = S.selNode === n.id;
    const dim = S.selNode && hlIds && !hlIds.has(n.id);

    // Pick fill/stroke colors
    let fill, stroke;
    if(n.type === "dragon" || n.type === "irid"){
      const den = DRAGON_DEN[n.den] || DRAGON_DEN.black;
      fill = den.fill;
      stroke = den.stroke;
    } else {
      const af = AFFIL[n.affil] || AFFIL.faculty;
      fill = "#0e0b1f";
      stroke = af.border;
    }

    const grp = mk("g", {
      "data-id": n.id,
      style:"cursor:pointer",
      opacity: dim ? 0.1 : (faded ? 0.22 : 1),
    });
    g.appendChild(grp);

    // Violet load pulse — draws attention to the protagonist
    if(S.showVioletPulse && n.id === "violet" && !faded){
      const pulse1 = mk("circle", {
        cx: pos.x, cy: pos.y,
        r: r + 6, fill:"none", stroke:"#a78bfa",
        "stroke-width":2, opacity:0.9,
        class:"v-pulse",
      });
      const pulse2 = mk("circle", {
        cx: pos.x, cy: pos.y,
        r: r + 6, fill:"none", stroke:"#a78bfa",
        "stroke-width":2, opacity:0.9,
        class:"v-pulse",
        style:"animation-delay:0.9s",
      });
      grp.appendChild(pulse1);
      grp.appendChild(pulse2);
    }

    // "New this book" dashed ring
    if(isNew && !faded){
      grp.appendChild(mk("circle", {
        cx: pos.x, cy: pos.y,
        r: r + 8,
        fill:"none", stroke:"#a78bfa",
        "stroke-width":1.4, "stroke-dasharray":"3 3",
        opacity:.85,
      }));
    }

    // Selected glow halo
    if(sel){
      const haloShape = makeShape(n.type, pos.x, pos.y, r+5, stroke, stroke, 0);
      haloShape.setAttribute("opacity", "0.25");
      grp.appendChild(haloShape);
    }

    // Main shape
    const shapeFill = sel ? stroke : fill;
    const shape = makeShape(n.type, pos.x, pos.y, r, shapeFill, stroke, sel ? 2.8 : 1.6);
    grp.appendChild(shape);

    // Initials inside
    const ini = mk("text", {
      x: pos.x, y: pos.y + 4,
      fill: sel ? "#0a0817" : (n.type==="dragon" || n.type==="irid" ? "#fff" : stroke),
      "font-size": n.size === "main" ? 9 : 7.5,
      "text-anchor":"middle",
      "font-weight":"bold",
      "pointer-events":"none",
    });
    ini.textContent = n.label.split(/[\s/]+/).map(w => w[0] || "").join("").slice(0,3).toUpperCase();
    grp.appendChild(ini);

    // Label below shape
    const labelColor = sel ? "#fde68a" : (n.type==="dragon" || n.type==="irid" ? stroke : "#cfd8e6");
    const lbl = mk("text", {
      x: pos.x, y: pos.y + r + 12,
      fill: labelColor,
      "font-size": n.size === "main" ? 9.5 : 8,
      "text-anchor":"middle",
      "font-weight": n.size === "main" ? "bold" : "500",
      "pointer-events":"none",
    });
    lbl.textContent = n.label;
    grp.appendChild(lbl);

    // Status icon
    if(n.status === "killed" || n.status === "deceased" || n.status === "executed" || n.status === "sacrificed"){
      const sk = mk("text", {x: pos.x + r*0.7, y: pos.y - r*0.65, "font-size":11, "pointer-events":"none"});
      sk.textContent = n.status === "sacrificed" ? "⭐" : "💀";
      grp.appendChild(sk);
    }
    if(n.status === "missing"){
      const sk = mk("text", {x: pos.x + r*0.7, y: pos.y - r*0.65, "font-size":11, "pointer-events":"none"});
      sk.textContent = "⚠️";
      grp.appendChild(sk);
    }

    // Signet glyph badge — small symbol top-left of shape
    const glyph = SIGNET_GLYPHS[n.id];
    if(glyph && !faded){
      const gx = pos.x - r*0.85;
      const gy = pos.y - r*0.55;
      // backdrop circle for readability
      grp.appendChild(mk("circle", {
        cx: gx, cy: gy, r: 6,
        fill:"#0a0817", stroke: glyph.color, "stroke-width":1.2,
        opacity:0.95, "pointer-events":"none",
      }));
      const gt = mk("text", {
        x: gx, y: gy + 3.5,
        fill: glyph.color,
        "font-size": 9,
        "text-anchor":"middle",
        "font-weight":"bold",
        "pointer-events":"none",
        class:"signet-glyph",
      });
      gt.textContent = glyph.sym;
      grp.appendChild(gt);
    }

    if(faded){
      const lblY = pos.y + r + 22;
      const xt = mk("text", {
        x: pos.x, y: lblY,
        fill: n.status === "killed" || n.status === "executed" ? "#7f1d1d" : "#3a2f5a",
        "font-size": 6.5,
        "text-anchor":"middle",
        "pointer-events":"none",
      });
      xt.textContent = n.status === "killed" ? "(killed)" : (n.status === "executed" ? "(executed)" : (n.status === "sacrificed" ? "(sacrificed)" : "(deceased)"));
      grp.appendChild(xt);
    }

    grp.addEventListener("mousedown", e => { e.stopPropagation(); S.ndrag = n.id; });
    grp.addEventListener("click", e => {
      e.stopPropagation();
      if(!S.wasDrag){
        S.selNode = n.id;
        sidebarOpen = true;
        applySidebar();
        renderSidebar();
        renderSVG();
      }
    });
  });

  renderLegend();
}

// ║ LEGEND                                                           ║

function renderLegend(){
  // Ensure the reopen button exists
  let lrb = document.getElementById("legend-reopen");
  if(!lrb){
    lrb = document.createElement("button");
    lrb.id = "legend-reopen";
    lrb.textContent = "📜 Legend";
    lrb.addEventListener("click", () => {
      legHidden = false;
      renderLegend();
    });
    canvasEl.appendChild(lrb);
  }

  let leg = document.getElementById("leg-ov");
  if(!leg){
    leg = document.createElement("div");
    leg.id = "leg-ov";
    canvasEl.appendChild(leg);
    leg.addEventListener("mousedown", e => {
      const hdr = document.getElementById("leg-hdr");
      if(!hdr || !hdr.contains(e.target)) return;
      // Don't start drag if user clicked one of the buttons
      if(e.target.closest("button")) return;
      legDrag = true;
      const r = leg.getBoundingClientRect();
      legDS = {mx:e.clientX, my:e.clientY, lx:r.left, ly:r.top};
      e.preventDefault();
    });
  }

  // Toggle full hide
  if(legHidden){
    leg.style.display = "none";
    lrb.style.display = "block";
    return;
  }
  leg.style.display = "block";
  lrb.style.display = "none";

  if(legPos.y !== null){
    leg.style.bottom = "auto";
    leg.style.top = legPos.y + "px";
    leg.style.left = legPos.x + "px";
  } else {
    leg.style.bottom = "10px";
    leg.style.top = "auto";
    leg.style.left = legPos.x + "px";
  }

  let h = `<div id="leg-hdr">
    <span>⚡ LEGEND</span>
    <div style="display:flex;gap:4px;align-items:center">
      <button id="leg-collapse-btn" style="background:none;border:1px solid #2a1f4a;color:#7d6fa8;border-radius:4px;padding:0 6px;font-size:.65rem;cursor:pointer;line-height:1.5" title="${legCollapsed ? 'Expand' : 'Collapse'}">${legCollapsed ? '[ + ]' : '[ − ]'}</button>
      <button id="leg-hide-btn" style="background:none;border:1px solid #2a1f4a;color:#7d6fa8;border-radius:4px;padding:0 6px;font-size:.65rem;cursor:pointer;line-height:1.5" title="Hide legend">✕</button>
    </div>
  </div>`;

  if(!legCollapsed){
    h += `<div id="leg-body" style="font-size:9px">`;

    // Relationship lines
    h += `<div class="leg-section-hdr" data-sec="rel">
      <span>Relationship Lines</span>
      <span class="lcaret">${legSections.rel ? '▼' : '▶'}</span>
    </div>`;
    h += `<div class="leg-section-body ${legSections.rel ? '' : 'collapsed'}">`;
    REL_TYPES.filter(r => r.id !== "all").forEach(r => {
      const ds = r.dash ? "border-top:1.5px dashed " + r.color : "border-top:1.5px solid " + r.color;
      h += `<div style="display:flex;align-items:center;gap:5px;margin:1.5px 0">
        <div style="width:18px;height:0;${ds};flex-shrink:0"></div>
        <span style="color:${r.color}">${r.label}</span>
      </div>`;
    });
    h += `</div>`;

    // Affiliations
    h += `<div class="leg-section-hdr" data-sec="affil">
      <span>Affiliations · Border Color</span>
      <span class="lcaret">${legSections.affil ? '▼' : '▶'}</span>
    </div>`;
    h += `<div class="leg-section-body ${legSections.affil ? '' : 'collapsed'}">`;
    Object.entries(AFFIL).forEach(([k,v]) => {
      h += `<div style="display:flex;align-items:center;gap:5px;margin:1.5px 0">
        <div style="width:8px;height:8px;border-radius:50%;border:1.5px solid ${v.border};background:transparent;flex-shrink:0"></div>
        <span>${v.label}</span>
      </div>`;
    });
    h += `</div>`;

    // Dragon Dens
    h += `<div class="leg-section-hdr" data-sec="dens">
      <span>Dragon Dens (canon)</span>
      <span class="lcaret">${legSections.dens ? '▼' : '▶'}</span>
    </div>`;
    h += `<div class="leg-section-body ${legSections.dens ? '' : 'collapsed'}">`;
    Object.entries(DRAGON_DEN).filter(([k]) => k !== "irid").forEach(([k,v]) => {
      h += `<div style="display:flex;align-items:center;gap:5px;margin:1.5px 0">
        <div style="width:9px;height:9px;background:${v.fill};border:1.2px solid ${v.stroke};flex-shrink:0;transform:rotate(45deg)"></div>
        <span>${v.label}</span>
      </div>`;
    });
    h += `</div>`;

    // Icons
    h += `<div class="leg-section-hdr" data-sec="icons">
      <span>Icons & Signets</span>
      <span class="lcaret">${legSections.icons ? '▼' : '▶'}</span>
    </div>`;
    h += `<div class="leg-section-body ${legSections.icons ? '' : 'collapsed'}">`;
    [
      ["💀","Killed in story"],
      ["⭐","Sacrificed"],
      ["⚠️","Missing (last seen)"],
      ["⚡ ◐ ❄ ◇","Signet glyphs (main characters)"],
      ["dashed ring","New this book"],
      ["faded","No longer present"],
      ["large shape","Main character"],
      ["small shape","Supporting"],
    ].forEach(([ic,desc]) => {
      h += `<div style="display:flex;align-items:flex-start;gap:5px;margin:1.5px 0">
        <span style="color:#fde68a;min-width:60px;flex-shrink:0;font-size:8.5px">${ic}</span>
        <span style="font-size:8.5px">${desc}</span>
      </div>`;
    });
    h += `</div>`;

    h += `<div style="color:#7d6fa8;font-size:8.5px;margin-top:7px;line-height:1.3;font-style:italic;border-top:1px solid #14102a;padding-top:4px">Click nodes for details · drag to rearrange · scroll to zoom · drag empty space to pan</div>`;

    h += `</div>`;
  }
  
  leg.innerHTML = h;
  
  const collapseBtn = document.getElementById("leg-collapse-btn");
  if(collapseBtn) collapseBtn.addEventListener("click", (e) => { e.stopPropagation(); legCollapsed = !legCollapsed; renderLegend(); });

  const hideBtn = document.getElementById("leg-hide-btn");
  if(hideBtn) hideBtn.addEventListener("click", (e) => { e.stopPropagation(); legHidden = true; renderLegend(); });

  // Attach handlers for collapsible sections
  leg.querySelectorAll(".leg-section-hdr").forEach(hdr => {
    hdr.addEventListener("click", e => {
      e.stopPropagation();
      const sec = hdr.getAttribute("data-sec");
      legSections[sec] = !legSections[sec];
      renderLegend();
    });
  });
}

function renderSearch(){
  let so = document.getElementById("search-ov");
  if(so){
    // Already exists — just update position, don't rebuild (preserves input focus + dropdown state)
    so.style.top = searchPos.y + "px";
    so.style.left = searchPos.x + "px";
    return;
  }
  so = document.createElement("div");
  so.id = "search-ov";
  canvasEl.appendChild(so);
  so.addEventListener("mousedown", e => {
    const hdr = document.getElementById("search-hdr");
    if(!hdr || !hdr.contains(e.target)) return;
    searchDrag = true;
    searchDS = {mx:e.clientX, my:e.clientY, sx:searchPos.x, sy:searchPos.y};
    e.preventDefault();
  });
  so.style.top = searchPos.y + "px";
  so.style.left = searchPos.x + "px";

  so.innerHTML = `
    <div id="search-hdr"><span>🔍 SEARCH</span></div>
    <div id="search-body">
      <input id="search-input" type="text" placeholder="Type a name, then Enter…" autocomplete="off"/>
      <div id="search-results"></div>
    </div>
  `;

  const input = document.getElementById("search-input");
  const results = document.getElementById("search-results");

  input.addEventListener("input", e => {
    searchQuery = e.target.value;
    // Close results when typing again (waiting for Enter)
    if(searchResultsOpen){
      searchResultsOpen = false;
      results.classList.remove("open");
      results.innerHTML = "";
    }
  });

  input.addEventListener("keydown", e => {
    if(e.key === "Enter"){
      e.preventDefault();
      runSearch();
    } else if(e.key === "Escape"){
      searchResultsOpen = false;
      results.classList.remove("open");
      results.innerHTML = "";
    }
  });
}

function runSearch(){
  const q = searchQuery.trim().toLowerCase();
  const results = document.getElementById("search-results");
  if(!q){
    searchResultsOpen = false;
    results.classList.remove("open");
    results.innerHTML = "";
    return;
  }
  const matches = NODES.filter(n =>
    n.label.toLowerCase().includes(q) ||
    n.role.toLowerCase().includes(q) ||
    (n.signet && n.signet.toLowerCase().includes(q))
  ).slice(0, 12);

  if(!matches.length){
    results.innerHTML = `<div class="sr-empty">No characters match "${searchQuery}"</div>`;
  } else {
    results.innerHTML = matches.map(n => {
      const af = AFFIL[n.affil] || AFFIL.faculty;
      const col = (n.type==="dragon"||n.type==="irid") ? (DRAGON_DEN[n.den]||DRAGON_DEN.black).stroke : af.border;
      const dim = n.book > S.book;
      const status = n.status !== "alive" ? ` · ${n.status}` : "";
      return `<div class="sr-item" data-id="${n.id}" style="${dim ? 'opacity:0.5' : ''}">
        <div class="sr-dot" style="border-color:${col};background:${col}33"></div>
        <div>
          <div class="sr-name">${n.label}${dim ? ' <span style="color:#7d6fa8;font-size:.55rem">(Book '+n.book+')</span>' : ''}</div>
          <div class="sr-role">${n.role}${status}</div>
        </div>
      </div>`;
    }).join("");
  }
  searchResultsOpen = true;
  results.classList.add("open");

  results.querySelectorAll(".sr-item").forEach(item => {
    item.addEventListener("click", () => {
      const id = item.getAttribute("data-id");
      selectAndCenter(id);
      // Close dropdown after selection
      searchResultsOpen = false;
      searchQuery = "";
      results.classList.remove("open");
      results.innerHTML = "";
      const inp = document.getElementById("search-input");
      if(inp) inp.value = "";
    });
  });
}

// Center on a node and select it. If node is from a future book, advance the book.
function selectAndCenter(id){
  const n = NODES.find(x => x.id === id);
  if(!n) return;
  // Advance book if node not yet visible
  if(n.book > S.book) S.book = n.book;
  // Ensure type filter is on
  S.typeFilters[n.type] = true;
  // Cancel violet pulse so it doesn't compete for attention
  S.showVioletPulse = false;
  S.selNode = id;
  sidebarOpen = true;

  // Center the node in the canvas viewport
  const pos = S.pos[id];
  if(pos){
    const rect = canvasEl.getBoundingClientRect();
    S.pan.x = rect.width/2 - pos.x * S.scale;
    S.pan.y = rect.height/2 - pos.y * S.scale;
  }

  render();
}

// Helper: get SVG string (not element) for legend inline display
function shapeSvgString(type, cx, cy, r, fill, stroke, sw){
  const t = TYPE_SHAPES[type] || TYPE_SHAPES.human;
  const a = `fill="${fill}" stroke="${stroke}" stroke-width="${sw}" stroke-linejoin="round"`;
  switch(t.shape){
    case "circle":
      return `<circle cx="${cx}" cy="${cy}" r="${r}" ${a}/>`;
    case "diamond":
      return `<polygon points="${cx},${cy-r} ${cx+r},${cy} ${cx},${cy+r} ${cx-r},${cy}" ${a}/>`;
    case "triangle":
      return `<polygon points="${cx},${cy-r*1.05} ${cx+r*0.95},${cy+r*0.7} ${cx-r*0.95},${cy+r*0.7}" ${a}/>`;
    case "chevron":
      return `<polygon points="${cx},${cy+r*1.05} ${cx+r*0.95},${cy-r*0.5} ${cx+r*0.4},${cy-r*0.7} ${cx-r*0.4},${cy-r*0.7} ${cx-r*0.95},${cy-r*0.5}" ${a}/>`;
    case "hexagon": {
      const pts = [];
      for(let i=0;i<6;i++){
        const ang = Math.PI/3*i - Math.PI/2;
        pts.push(`${(cx + r*Math.cos(ang)).toFixed(2)},${(cy + r*Math.sin(ang)).toFixed(2)}`);
      }
      return `<polygon points="${pts.join(" ")}" ${a}/>`;
    }
    case "star6": {
      const pts = [];
      for(let i=0;i<12;i++){
        const ang = Math.PI/6*i - Math.PI/2;
        const rr = i%2===0 ? r : r*0.5;
        pts.push(`${(cx + rr*Math.cos(ang)).toFixed(2)},${(cy + rr*Math.sin(ang)).toFixed(2)}`);
      }
      return `<polygon points="${pts.join(" ")}" ${a}/>`;
    }
    case "star8": {
      const pts = [];
      for(let i=0;i<16;i++){
        const ang = Math.PI/8*i - Math.PI/2;
        const rr = i%2===0 ? r : r*0.55;
        pts.push(`${(cx + rr*Math.cos(ang)).toFixed(2)},${(cy + rr*Math.sin(ang)).toFixed(2)}`);
      }
      return `<polygon points="${pts.join(" ")}" ${a}/>`;
    }
  }
  return `<circle cx="${cx}" cy="${cy}" r="${r}" ${a}/>`;
}

function applySidebar(){
  const sb = document.getElementById("sidebar");
  let rb = document.getElementById("sidebar-reopen");
  if(!rb){
    rb = document.createElement("button");
    rb.id = "sidebar-reopen";
    rb.textContent = "📋 Info";
    rb.addEventListener("click", () => {
      sidebarOpen = true;
      applySidebar();
      renderSidebar();
    });
    canvasEl.appendChild(rb);
  }
  const isMobile = window.innerWidth <= 780;
  if(isMobile){
    // Mobile: sidebar always rendered as drawer, slide in/out via transform
    sb.style.display = "flex";
    if(sidebarOpen){
      sb.classList.add("mobile-open");
      rb.style.display = "none";
    } else {
      sb.classList.remove("mobile-open");
      rb.style.display = "block";
    }
  } else {
    // Desktop: sidebar fixed-width column, toggled by display
    sb.classList.remove("mobile-open");
    sb.style.display = sidebarOpen ? "flex" : "none";
    rb.style.display = sidebarOpen ? "none" : "block";
  }
}

function renderSidebar(){
  sBody.innerHTML = "";

  if(S.selNode){
    const n = NODES.find(x => x.id === S.selNode);
    if(!n) return;
    sTitle.textContent = n.label;

    const af = AFFIL[n.affil] || AFFIL.faculty;
    let nc;
    if(n.type === "dragon" || n.type === "irid"){
      const den = DRAGON_DEN[n.den] || DRAGON_DEN.black;
      nc = den.stroke;
    } else {
      nc = af.border;
    }

    // Portrait — render large shape SVG
    const portrait = document.createElement("div");
    portrait.id = "char-portrait";
    portrait.innerHTML = `
      <svg width="120" height="120" viewBox="-50 -50 100 100" style="position:relative;z-index:1">
        ${shapeSvgString(n.type, 0, 0, 35, "#15102e", nc, 2.5)}
        <text x="0" y="6" fill="${nc}" font-size="20" font-weight="bold" text-anchor="middle" font-family="Cinzel,serif">${n.label.split(/[\s/]+/).map(w => w[0]||"").join("").slice(0,3).toUpperCase()}</text>
      </svg>
      <div class="faction-bar" style="background:${nc}22;color:${nc};border-top:1px solid ${nc}55">${af.label}</div>
    `;
    sBody.appendChild(portrait);

    // Card body
    const body = document.createElement("div");
    body.id = "card-body";
    let h = `<h2 style="color:${nc}">${n.label}</h2>`;
    h += `<div style="margin:5px 0">`;
    h += `<span class="tag" style="background:${nc}22;border:1px solid ${nc}55;color:${nc}">${n.role}</span>`;

    // Type tag
    const typeLbl = (TYPE_SHAPES[n.type] || {}).label || n.type;
    h += `<span class="tag" style="background:#0c0a1f;border:1px solid #2a1f4a;color:#9c8fbf">${typeLbl}</span>`;

    // Status
    if(n.status === "killed") h += `<span class="tag" style="background:#3a0a0a;border:1px solid #7f1d1d;color:#ef4444">💀 Killed</span>`;
    else if(n.status === "executed") h += `<span class="tag" style="background:#3a0a0a;border:1px solid #7f1d1d;color:#ef4444">💀 Executed</span>`;
    else if(n.status === "deceased") h += `<span class="tag" style="background:#1f1838;border:1px solid #2a1f4a;color:#9c8fbf">💀 Deceased</span>`;
    else if(n.status === "sacrificed") h += `<span class="tag" style="background:#1a1305;border:1px solid #b8860b;color:#fbbf24">⭐ Sacrificed</span>`;
    else if(n.status === "missing") h += `<span class="tag" style="background:#1a1305;border:1px solid #b45309;color:#f59e0b">⚠️ Missing</span>`;
    else if(n.status === "prisoner") h += `<span class="tag" style="background:#3a0a0a;border:1px solid #b45309;color:#f59e0b">⛓ Prisoner</span>`;

    if(n.book === S.book) h += `<span class="tag" style="background:#1a1338;border:1px solid #7c3aed;color:#a78bfa">✦ New this book</span>`;

    h += `</div>`;

    // Stats
    h += `<div class="stat-row">`;
    h += `<div class="stat"><b>Introduced</b>Book ${n.book}</div>`;
    h += `<div class="stat"><b>Status</b>${n.status === "alive" ? "Alive" : (n.status === "killed" ? "💀 Dead" : (n.status === "missing" ? "⚠️ Missing" : (n.status === "sacrificed" ? "⭐ Sacrificed" : "💀 Gone")))}</div>`;
    h += `<div class="stat"><b>Type</b>${n.size === "main" ? "Main" : "Side"}</div>`;
    h += `</div>`;

    if(n.den){
      const den = DRAGON_DEN[n.den];
      h += `<div class="stat" style="display:block;margin-bottom:8px"><b>Dragon Den</b>${den.label}</div>`;
    }

    // NEW FIELDS: Signet, Wing, Homeland, Dragon Bond
    if(n.signet){
      h += `<div class="stat" style="display:block;margin-bottom:8px"><b>Signet</b>${n.signet}</div>`;
    }
    if(n.wing){
      h += `<div class="stat" style="display:block;margin-bottom:8px"><b>Wing</b>${n.wing}</div>`;
    }
    if(n.homeland){
      h += `<div class="stat" style="display:block;margin-bottom:8px"><b>Origin</b>${n.homeland}</div>`;
    }

    // Dragon bond (find bonded relationship)
    const bondedEdge = EDGES.find(e => (e.from === n.id || e.to === n.id) && e.type === "bonded" && e.book <= S.book);
    if(bondedEdge){
      const dragonId = bondedEdge.from === n.id ? bondedEdge.to : bondedEdge.from;
      const dragonNode = NODES.find(x => x.id === dragonId);
      if(dragonNode){
        const denInfo = dragonNode.den ? ` (${DRAGON_DEN[dragonNode.den].label})` : "";
        h += `<div class="stat" style="display:block;margin-bottom:8px"><b>Dragon Bond</b>${dragonNode.label}${denInfo}</div>`;
      }
    }

    if(n.trait){
      h += `<div class="sig-trait">${n.trait}</div>`;
    }

    h += `<div class="bio-text">${n.bio}</div>`;

    // Connections
    h += `<div class="ch4">⚡ Connections</div><div id="clist"></div>`;
    body.innerHTML = h;
    sBody.appendChild(body);

    const cl = document.getElementById("clist");
    const conns = EDGES.filter(e => (e.from === n.id || e.to === n.id) && e.book <= S.book);
    if(!conns.length){
      cl.innerHTML = "<div class='ci' style='color:#3a2f5a;padding:5px'>No connections visible yet</div>";
    } else {
      conns.forEach(e => {
        const oid = e.from === n.id ? e.to : e.from;
        const o = NODES.find(x => x.id === oid);
        if(!o) return;
        const col = getRC(e.type);
        cl.insertAdjacentHTML("beforeend",
          `<div class='ci'><span class='cn'>${o.label}</span> — ${e.label} <span style='color:${col};font-size:.58rem'>[${e.type}]</span></div>`
        );
      });
    }
  } else {
    sTitle.textContent = "Book Overview";
    const b = BOOKS[S.book-1];
    const evts = KEY_EVENTS[S.book] || [];
    const transition = BOOK_TRANSITIONS[S.book];

    let h = "";

    // Compact header strip — book number + era + year (replaces the duplicate-title panel)
    h += `<div class="panel" style="background:linear-gradient(135deg,rgba(167,139,250,.08),rgba(124,58,237,.02));padding:9px 11px">
      <div style="display:flex;align-items:baseline;justify-content:space-between;gap:8px">
        <div>
          <div style="font-family:'Cinzel',serif;color:#e0e7ff;font-size:.78rem;font-weight:600;letter-spacing:1px">${b.title}</div>
          <div style="color:#7d6fa8;font-size:.6rem;font-style:italic;margin-top:2px;font-family:'Cormorant Garamond',serif">${b.era}</div>
        </div>
        <div style="color:#a78bfa;font-size:.6rem;font-weight:600;font-family:'Cinzel',serif;flex-shrink:0">${b.year}${b.future ? " · TBA" : ""}</div>
      </div>
    </div>`;

    // "What Changed" panel — only for books 2+ that have a transition
    if(transition){
      h += `<div class="panel" style="background:linear-gradient(180deg,rgba(167,139,250,.06),transparent);border-bottom:1px solid #2a1f4a">
        <h3 style="color:#fde68a">⚡ What Changed</h3>
        <div style="display:flex;flex-direction:column;gap:4px;margin-top:4px">`;
      transition.changes.forEach(c => {
        h += `<div style="font-size:.68rem;color:#cfd8e6;padding:4px 8px;background:#0c0a1f;border-left:2px solid #fbbf24;border-radius:0 3px 3px 0;line-height:1.4">${c}</div>`;
      });
      h += `</div></div>`;
    }

    h += `<div class="panel"><h3>Key Events</h3>`;
    evts.forEach((ev,i) => {
      h += `<div class="evt">${ev}</div>`;
    });
    h += `</div>`;

    h += `<div class="panel"><h3>About this Chart</h3><p>50+ characters across all four books of <i>The Empyrean</i> series by Rebecca Yarros. Use the book buttons above to advance the timeline — characters fade when they leave the story, and new ones appear with a glowing dashed ring. Filter relationships in the bar below the books.</p></div>`;

    h += `<div class="panel"><h3>How to Read</h3>`;
    h += `<p style="margin-bottom:5px"><b style="color:#a78bfa">Shapes</b> show character type — humans are circles, dragons are diamonds, gryphons are triangles, venin are hexagons, gods are 6-point stars, irids are 8-point stars, and wyverns get a chevron.</p>`;
    h += `<p style="margin-bottom:5px"><b style="color:#a78bfa">Border colors</b> show affiliation. <b style="color:#a78bfa">Dragon dens</b> color dragon nodes by canon (black, blue, green, brown, red, orange, gold).</p>`;
    h += `<p><b style="color:#a78bfa">Bands</b> divide the world by faction — Gods at the top, Venin at the bottom, with Riders, Aretia, and Poromiel between.</p>`;
    h += `</div>`;

    sBody.innerHTML = h;
  }
}

let ms = null;
svgEl.addEventListener("mousedown", e => {
  if(S.ndrag) return;
  ms = {x:e.clientX, y:e.clientY, px:S.pan.x, py:S.pan.y};
  S.wasDrag = false;
});

window.addEventListener("mousemove", e => {
  // Legend drag
  if(legDrag && legDS){
    const leg = document.getElementById("leg-ov");
    if(!leg) return;
    const nx = legDS.lx + (e.clientX - legDS.mx);
    const ny = legDS.ly + (e.clientY - legDS.my);
    leg.style.left = nx + "px";
    leg.style.top = ny + "px";
    leg.style.bottom = "auto";
    legPos = {x:nx, y:ny};
    return;
  }
  // Search overlay drag
  if(searchDrag && searchDS){
    const so = document.getElementById("search-ov");
    if(!so) return;
    const nx = searchDS.sx + (e.clientX - searchDS.mx);
    const ny = searchDS.sy + (e.clientY - searchDS.my);
    so.style.left = nx + "px";
    so.style.top = ny + "px";
    searchPos = {x:nx, y:ny};
    return;
  }
  // Node drag
  if(S.ndrag){
    S.wasDrag = true;
    const r = svgEl.getBoundingClientRect();
    S.pos[S.ndrag] = {
      x: (e.clientX - r.left - S.pan.x) / S.scale,
      y: (e.clientY - r.top  - S.pan.y) / S.scale
    };
    renderSVG();
    return;
  }
  // Pan
  if(ms){
    const dx = e.clientX - ms.x, dy = e.clientY - ms.y;
    if(Math.abs(dx) > 3 || Math.abs(dy) > 3) S.wasDrag = true;
    S.pan = {x: ms.px + dx, y: ms.py + dy};
    renderSVG();
  }
});

window.addEventListener("mouseup", () => {
  legDrag = false;
  legDS = null;
  searchDrag = false;
  searchDS = null;
  S.ndrag = null;
  ms = null;
  setTimeout(() => { S.wasDrag = false; }, 50);
});

svgEl.addEventListener("click", e => {
  if(!S.wasDrag && e.target === svgEl){
    S.selNode = null;
    renderSidebar();
    renderSVG();
  }
});

canvasEl.addEventListener("wheel", e => {
  e.preventDefault();
  const newScale = Math.min(3, Math.max(0.18, S.scale - e.deltaY * 0.001));
  S.scale = newScale;
  renderSVG();
}, {passive:false});

// ── Stars ──
const starsEl = document.getElementById("stars");
for(let i=0;i<150;i++){
  const s = document.createElement("div");
  s.className = "star";
  s.style.left = Math.random()*100 + "%";
  s.style.top = Math.random()*100 + "%";
  s.style.animationDelay = Math.random()*4 + "s";
  s.style.animationDuration = (Math.random()*3 + 3) + "s";
  const size = Math.random() < 0.7 ? 1 : 2;
  s.style.width = s.style.height = size + "px";
  starsEl.appendChild(s);
}

// ── Responsive viewport handling ──
function updateViewportScale(){
  const vw = window.innerWidth;
  
  // Simple breakpoint-based scaling
  if(vw < 600){
    // Small mobile
    S.scale = 0.45;
  } else if(vw < 900){
    // Large mobile / small tablet
    S.scale = 0.65;
  } else if(vw < 1200){
    // Tablet
    S.scale = 0.75;
  } else {
    // Desktop - comfortable zoom out for Mac
    S.scale = 0.85;
  }
  
  renderSVG();
}

// ── Initial render ──
function initChart(){
  updateViewportScale();
  // On mobile, start with sidebar closed (better first impression)
  if(window.innerWidth <= 780){
    sidebarOpen = false;
  }
  render();
  // Fade violet pulse after 6 seconds — long enough to notice, short enough to not annoy
  setTimeout(() => {
    if(S.showVioletPulse){
      S.showVioletPulse = false;
      renderSVG();
    }
  }, 6000);
}

// Start immediately if DOM ready, otherwise wait
if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', initChart);
} else {
  initChart();
}

// Update scale on window resize (debounced for performance)
let resizeTimeout;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimeout);
  resizeTimeout = setTimeout(() => {
    updateViewportScale();
    applySidebar();
  }, 100);
});
</script>
